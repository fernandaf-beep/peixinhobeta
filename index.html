<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>🌊 PEDIDO OCEÂNICO EXTREMO 💙</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: "Comic Sans MS", cursive;
  text-align: center;
  color: white;
}

/* FUNDO OCEANO */
.oceano {
  background: radial-gradient(circle at center, #00cfff, #001f3f);
  animation: agua 10s infinite alternate;
}

@keyframes agua {
  0% {filter: hue-rotate(0deg);}
  100% {filter: hue-rotate(40deg);}
}

/* TEXTO */
h1 {
  margin-top: 10%;
  font-size: 3em;
  text-shadow: 0 0 20px cyan, 0 0 40px blue;
  animation: flutuar 3s infinite ease-in-out;
}

@keyframes flutuar {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-15px);}
}

/* BOTÕES */
button {
  padding: 20px 40px;
  margin: 20px;
  font-size: 1.5em;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  background: cyan;
  box-shadow: 0 0 20px cyan;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.2) rotate(5deg);
}

/* BOLHAS */
.bolha {
  position: absolute;
  bottom: -50px;
  width: 20px;
  height: 20px;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  animation: subir linear infinite;
}

@keyframes subir {
  from {transform: translateY(0);}
  to {transform: translateY(-110vh);}
}

/* PEIXES */
.peixe {
  position: absolute;
  font-size: 2em;
  animation: nadar linear infinite;
}

@keyframes nadar {
  from {transform: translateX(-10vw);}
  to {transform: translateX(110vw);}
}

/* FESTA */
.festa {
  background: linear-gradient(45deg, #00ffcc, #ffff00, #ff00ff);
  animation: festaBg 1s infinite;
  color: black;
}

@keyframes festaBg {
  0% {filter: hue-rotate(0deg);}
  100% {filter: hue-rotate(360deg);}
}

/* CAOS */
.terror {
  background: black;
  color: red;
  animation: glitch 0.1s infinite;
}

@keyframes glitch {
  0% {transform: translate(2px, -2px);}
  50% {transform: translate(-2px, 2px);}
  100% {transform: translate(2px, 2px);}
}

.caos-texto {
  font-size: 2em;
  animation: piscar 0.2s infinite;
}

@keyframes piscar {
  0% {opacity: 1;}
  50% {opacity: 0;}
  100% {opacity: 1;}
}
</style>
</head>

<body class="oceano">

<h1>Olá, demônio da Tasmânia,<br>quer casar comigo hoje 23:99?</h1>

<button onclick="sim()">💙 SIM 💙</button>
<button onclick="nao()">💀 NÃO 💀</button>

<!-- BOLHAS -->
<script>
for (let i=0; i<40; i++) {
  let b = document.createElement("div");
  b.className = "bolha";
  b.style.left = Math.random()*100 + "vw";
  b.style.animationDuration = (5 + Math.random()*5) + "s";
  document.body.appendChild(b);
}

/* PEIXES NADANDO */
let emojis = ["🐋","🐳","🐙","🐟","🐠","🐡"];
for (let i=0; i<20; i++) {
  let p = document.createElement("div");
  p.className = "peixe";
  p.innerText = emojis[Math.floor(Math.random()*emojis.length)];
  p.style.top = Math.random()*100 + "vh";
  p.style.animationDuration = (10 + Math.random()*10) + "s";
  document.body.appendChild(p);
}

/* SIM */
function sim() {
  document.body.className = "festa";
  document.body.innerHTML = `
    <h1>💙 VOCÊ ACEITOU!!! 💙</h1>
    <h2>🐋🐙🐟 FESTA NO OCEANO 🐟🐙🐋</h2>

    <div style="font-size:3em; animation: girar 2s infinite linear;">
      🐋 🐙 🐟 🐠 🐡 🐳
    </div>

    <audio autoplay loop>
      <source src="happy.mp3" type="audio/mpeg">
    </audio>

    <style>
      @keyframes girar {
        from {transform: rotate(0);}
        to {transform: rotate(360deg);}
      }
    </style>
  `;

  for (let i=0; i<100; i++) {
    let confete = document.createElement("div");
    confete.innerText = "✨";
    confete.style.position = "absolute";
    confete.style.left = Math.random()*100+"vw";
    confete.style.top = Math.random()*100+"vh";
    confete.style.fontSize = "2em";
    document.body.appendChild(confete);
  }
}

/* NÃO */
function nao() {
  document.body.className = "terror";
  document.body.innerHTML = `
    <h1 class="caos-texto">
    VOCÊ É LOUCA?<br>
    EU VOU RECEBER NOTIFICAÇÃO QUE VOCÊ RESPONDEU ISSO<br>
    E FAZER XIXI NA SUA BOCA
    </h1>

    <img src="https://i.imgur.com/8QZ7Z6F.png" width="400">

    <audio autoplay loop>
      <source src="scream.mp3" type="audio/mpeg">
    </audio>
  `;

  setInterval(() => {
    document.body.style.backgroundColor =
      ["black","darkred","purple"][Math.floor(Math.random()*3)];
  }, 100);
}
</script>

</body>
</html>
